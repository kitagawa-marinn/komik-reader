<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komik Reader - Tachiyomi Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #7c3aed;
            --secondary-color: #6d28d9;
            --accent-color: #ec4899;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #2a2a2a;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            --transition: all 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background-color: var(--card-bg);
            padding: 1.5rem 1rem;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 20px;
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .tab-btn:active {
            transform: scale(0.95);
        }

        /* Main Content */
        .container {
            padding: 1rem;
            padding-bottom: 70px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 1.5rem 0 1rem 0;
            color: var(--text-primary);
        }

        /* Comics Grid */
        .comics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.8rem;
            margin-bottom: 2rem;
        }

        .comic-item {
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .comic-item:active {
            transform: scale(0.95);
        }

        .comic-cover {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 8px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            box-shadow: var(--shadow);
        }

        .comic-title {
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.5rem;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .up-badge {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #ef4444;
            color: white;
            padding: 0.3rem 0.5rem;
            border-radius: 4px 0 4px 0;
            font-size: 0.65rem;
            font-weight: 700;
        }

        /* Comics List (Detailed) */
        .comics-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .comic-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            gap: 1rem;
            padding: 1rem;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .comic-card:active {
            background-color: rgba(124, 58, 237, 0.1);
            border-color: var(--primary-color);
        }

        .comic-card-cover {
            width: 90px;
            height: 120px;
            border-radius: 8px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            flex-shrink: 0;
        }

        .comic-card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .comic-card-header {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .comic-card-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            flex: 1;
        }

        .update-badge {
            background-color: #ef4444;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 700;
            white-space: nowrap;
            margin-top: 0.2rem;
        }

        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .chapter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .chapter-item:active {
            background-color: rgba(124, 58, 237, 0.2);
        }

        .chapter-name {
            color: var(--text-primary);
            font-weight: 600;
        }

        .chapter-time {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 60px;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            flex: 1;
            height: 100%;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .nav-item:active {
            background-color: rgba(124, 58, 237, 0.1);
        }

        .nav-icon {
            font-size: 1.5rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            animation: fadeIn 0.3s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reader-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            overflow-y: auto;
        }

        .reader-modal.active {
            display: flex;
            flex-direction: column;
        }

        .reader-header {
            background-color: var(--card-bg);
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reader-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .reader-close {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .reader-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .reader-image {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .reader-controls {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .reader-btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .reader-btn:active {
            transform: scale(0.95);
        }

        .reader-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        /* Search */
        .search-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            margin: 1rem 0;
            width: 100%;
        }

        .search-box::placeholder {
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 480px) {
            .comics-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }

        .notice {
            background-color: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            padding: 1rem;
            margin: 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-title">📚 Komik Reader</div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('home')">Home</button>
            <button class="tab-btn" onclick="switchTab('explore')">Explore</button>
            <button class="tab-btn" onclick="switchTab('library')">Library</button>
            <button class="tab-btn" onclick="switchTab('series')">All Series</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Home Tab -->
        <div id="home-tab" class="tab-content">
            <div class="notice">
                <strong>Notice:</strong> Gunakan extension Tachiyomi untuk sumber komik yang lebih banyak.
            </div>

            <div class="section-title">Updates Terbaru</div>
            <div class="comics-list" id="recentUpdates"></div>

            <div class="section-title">Populer</div>
            <div class="comics-grid" id="popularComics"></div>

            <div class="section-title">Trending</div>
            <div class="comics-grid" id="trendingComics"></div>
        </div>

        <!-- Explore Tab -->
        <div id="explore-tab" class="tab-content" style="display: none;">
            <input type="text" class="search-box" id="searchInput" placeholder="Cari komik...">
            <div class="section-title">Hasil Pencarian</div>
            <div class="comics-grid" id="searchResults"></div>
        </div>

        <!-- Library Tab -->
        <div id="library-tab" class="tab-content" style="display: none;">
            <div class="section-title">Komik Ku Simpan</div>
            <div id="libraryComics"></div>
        </div>

        <!-- All Series Tab -->
        <div id="series-tab" class="tab-content" style="display: none;">
            <div class="section-title">Semua Komik</div>
            <div class="comics-list" id="allComics"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="switchTab('explore')">
            <span class="nav-icon">🔍</span>
            <span>Explore</span>
        </div>
        <div class="nav-item" onclick="switchTab('library')">
            <span class="nav-icon">📖</span>
            <span>Library</span>
        </div>
        <div class="nav-item" onclick="switchTab('series')">
            <span class="nav-icon">📚</span>
            <span>Series</span>
        </div>
    </div>

    <!-- Reader Modal -->
    <div id="readerModal" class="reader-modal">
        <div class="reader-header">
            <div class="reader-title" id="readerTitle"></div>
            <button class="reader-close" onclick="closeReader()">✕</button>
        </div>
        <div class="reader-content">
            <div class="reader-info" id="readerChapterInfo"></div>
            <img id="readerImage" class="reader-image" src="" alt="Halaman Komik">
            <div class="reader-controls">
                <button class="reader-btn" onclick="previousPage()">← Sebelumnya</button>
                <button class="reader-btn" onclick="closeReader()">Tutup</button>
                <button class="reader-btn" onclick="nextPage()">Berikutnya →</button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content" style="position: relative;">
            <button class="modal-close" onclick="closeDetail()">✕</button>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        const komikData = [
            {
                id: 1,
                title: "The Ruler Of Darkness",
                author: "Golem Factory",
                cover: "https://via.placeholder.com/200x280?text=Ruler+of+Darkness",
                rating: 4.8,
                status: "ongoing",
                chapters: [
                    { id: 1, name: "Chapter 30", time: "1 jam lalu", pages: 25 },
                    { id: 2, name: "Chapter 29", time: "7 hari lalu", pages: 24 },
                    { id: 3, name: "Chapter 28", time: "14 hari lalu", pages: 23 }
                ],
                isNew: true
            },
            {
                id: 2,
                title: "Only I Have An EX-Grade Summon",
                author: "Shinekami",
                cover: "https://via.placeholder.com/200x280?text=EX+Grade+Summon",
                rating: 4.7,
                status: "ongoing",
                chapters: [
                    { id: 1, name: "Chapter 39", time: "1 jam lalu", pages: 22 },
                    { id: 2, name: "Chapter 38", time: "7 hari lalu", pages: 21 },
                    { id: 3, name: "Chapter 37", time: "14 hari lalu", pages: 20 }
                ],
                isNew: true
            },
            {
                id: 3,
                title: "Second Life Ranker",
                author: "Redice Studio",
                cover: "https://via.placeholder.com/200x280?text=Second+Life+Ranker",
                rating: 4.9,
                status: "ongoing",
                chapters: [
                    { id: 1, name: "Chapter 232", time: "2 jam lalu", pages: 26 },
                    { id: 2, name: "Chapter 231", time: "7 hari lalu", pages: 25 },
                    { id: 3, name: "Chapter 230", time: "14 hari lalu", pages: 24 }
                ],
                isNew: true
            },
            {
                id: 4,
                title: "Solo Leveling",
                author: "Sung Shoon",
                cover: "https://via.placeholder.com/200x280?text=Solo+Leveling",
                rating: 4.9,
                status: "ongoing",
                chapters: [
                    { id: 1, name: "Chapter 180", time: "3 hari lalu", pages: 30 },
                    { id: 2, name: "Chapter 179", time: "10 hari lalu", pages: 29 },
                    { id: 3, name: "Chapter 178", time: "17 hari lalu", pages: 28 }
                ],
                isNew: false
            },
            {
                id: 5,
                title: "Omniscient Reader",
                author: "Sleepy-C",
                cover: "https://via.placeholder.com/200x280?text=Omniscient+Reader",
                rating: 4.8,
                status: "ongoing",
                chapters: [
                    { id: 1, name: "Chapter 142", time: "2 hari lalu", pages: 27 },
                    { id: 2, name: "Chapter 141", time: "9 hari lalu", pages: 26 },
                    { id: 3, name: "Chapter 140", time: "16 hari lalu", pages: 25 }
                ],
                isNew: false
            },
            {
                id: 6,
                title: "The Beginning After The End",
                author: "TurtleMe",
                cover: "https://via.placeholder.com/200x280?text=Beginning+After+End",
                rating: 4.7,
                status: "ongoing",
                chapters: [
                    { id: 1, name: "Chapter 176", time: "1 hari lalu", pages: 28 },
                    { id: 2, name: "Chapter 175", time: "8 hari lalu", pages: 27 },
                    { id: 3, name: "Chapter 174", time: "15 hari lalu", pages: 26 }
                ],
                isNew: false
            }
        ];

        let currentComic = null;
        let currentChapter = null;
        let currentPage = 1;
        let library = JSON.parse(localStorage.getItem('library')) || [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadRecentUpdates();
            loadPopularComics();
            loadAllComics();
            setupSearch();
            loadLibrary();
        });

        // Tab Switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.getElementById(tabName + '-tab').style.display = 'block';

            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            event.target.closest('.tab-btn')?.classList.add('active');

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.nav-item')?.classList.add('active');
        }

        // Load Recent Updates
        function loadRecentUpdates() {
            const recentContainer = document.getElementById('recentUpdates');
            recentContainer.innerHTML = komikData.slice(0, 3).map(comic => `
                <div class="comic-card" onclick="openDetail(${comic.id})">
                    <img src="${comic.cover}" alt="${comic.title}" class="comic-card-cover">
                    <div class="comic-card-info">
                        <div class="comic-card-header">
                            <div class="comic-card-title">${comic.title}</div>
                            ${comic.isNew ? '<div class="update-badge">UP</div>' : ''}
                        </div>
                        <div class="chapter-list">
                            ${comic.chapters.slice(0, 2).map(ch => `
                                <div class="chapter-item" onclick="openReader(${comic.id}, ${ch.id}); event.stopPropagation();">
                                    <span class="chapter-name">${ch.name}</span>
                                    <span class="chapter-time">${ch.time}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Load Popular Comics
        function loadPopularComics() {
            const popularContainer = document.getElementById('popularComics');
            popularContainer.innerHTML = komikData.map(comic => `
                <div class="comic-item" onclick="openDetail(${comic.id})">
                    ${comic.isNew ? '<div class="up-badge">UP</div>' : ''}
                    <img src="${comic.cover}" alt="${comic.title}" class="comic-cover">
                    <div class="comic-title">${comic.title}</div>
                </div>
            `).join('');
        }

        // Load Trending (sama dengan popular untuk sekarang)
        function loadPopularComics() {
            const popularContainer = document.getElementById('popularComics');
            const trendingContainer = document.getElementById('trendingComics');
            const html = komikData.map(comic => `
                <div class="comic-item" onclick="openDetail(${comic.id})">
                    ${comic.isNew ? '<div class="up-badge">UP</div>' : ''}
                    <img src="${comic.cover}" alt="${comic.title}" class="comic-cover">
                    <div class="comic-title">${comic.title}</div>
                </div>
            `).join('');
            if (popularContainer) popularContainer.innerHTML = html;
            if (trendingContainer) trendingContainer.innerHTML = html;
        }

        // Load All Comics
        function loadAllComics() {
            const allContainer = document.getElementById('allComics');
            allContainer.innerHTML = komikData.map(comic => `
                <div class="comic-card" onclick="openDetail(${comic.id})">
                    <img src="${comic.cover}" alt="${comic.title}" class="comic-card-cover">
                    <div class="comic-card-info">
                        <div class="comic-card-header">
                            <div class="comic-card-title">${comic.title}</div>
                            ${comic.isNew ? '<div class="update-badge">UP</div>' : ''}
                        </div>
                        <div style="color: var(--text-secondary); font-size: 0.85rem;">⭐ ${comic.rating}</div>
                        <div class="chapter-list">
                            ${comic.chapters.slice(0, 1).map(ch => `
                                <div class="chapter-item" onclick="openReader(${comic.id}, ${ch.id}); event.stopPropagation();">
                                    <span class="chapter-name">${ch.name}</span>
                                    <span class="chapter-time">${ch.time}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Load Library
        function loadLibrary() {
            const libraryContainer = document.getElementById('libraryComics');
            if (library.length === 0) {
                libraryContainer.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 2rem;">Belum ada komik yang disimpan</p>';
                return;
            }
            libraryContainer.innerHTML = komikData.filter(k => library.includes(k.id)).map(comic => `
                <div class="comic-card" onclick="openDetail(${comic.id})">
                    <img src="${comic.cover}" alt="${comic.title}" class="comic-card-cover">
                    <div class="comic-card-info">
                        <div class="comic-card-title">${comic.title}</div>
                        <button class="reader-btn" style="margin-top: auto;" onclick="removeFromLibrary(${comic.id}); event.stopPropagation();">Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        // Setup Search
        function setupSearch() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                if (query.length > 0) {
                    const results = komikData.filter(k => k.title.toLowerCase().includes(query));
                    document.getElementById('searchResults').innerHTML = results.map(comic => `
                        <div class="comic-item" onclick="openDetail(${comic.id})">
                            <img src="${comic.cover}" alt="${comic.title}" class="comic-cover">
                            <div class="comic-title">${comic.title}</div>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('searchResults').innerHTML = '';
                }
            });
        }

        // Open Detail Modal
        function openDetail(id) {
            currentComic = komikData.find(k => k.id === id);
            if (!currentComic) return;

            const detailHtml = `
                <img src="${currentComic.cover}" alt="${currentComic.title}" style="width: 100%; border-radius: 8px; margin-bottom: 1rem;">
                <h2>${currentComic.title}</h2>
                <p style="color: var(--text-secondary); margin-bottom: 1rem;">Oleh: ${currentComic.author}</p>
                <p style="color: var(--text-secondary); margin-bottom: 1rem;">⭐ Rating: ${currentComic.rating}</p>
                <button class="reader-btn" style="width: 100%; margin-bottom: 0.5rem;" onclick="toggleLibrary(${currentComic.id})">${library.includes(currentComic.id) ? '❤️ Hapus dari Library' : '🤍 Tambah ke Library'}</button>
                <div style="margin-top: 1.5rem;">
                    <h3 style="margin-bottom: 1rem;">Daftar Chapter</h3>
                    ${currentComic.chapters.map(ch => `
                        <div class="chapter-item" onclick="openReader(${currentComic.id}, ${ch.id}); closeDetail()">
                            <span class="chapter-name">${ch.name}</span>
                            <span class="chapter-time">${ch.time}</span>
                        </div>
                    `).join('')}
                </div>
            `;

            document.getElementById('detailContent').innerHTML = detailHtml;
            document.getElementById('detailModal').classList.add('active');
        }

        // Close Detail Modal
        function closeDetail() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // Toggle Library
        function toggleLibrary(id) {
            const index = library.indexOf(id);
            if (index > -1) {
                library.splice(index, 1);
            } else {
                library.push(id);
            }
            localStorage.setItem('library', JSON.stringify(library));
            loadLibrary();
        }

        // Remove from Library
        function removeFromLibrary(id) {
            const index = library.indexOf(id);
            if (index > -1) {
                library.splice(index, 1);
            }
            localStorage.setItem('library', JSON.stringify(library));
            loadLibrary();
        }

        // Open Reader
        function openReader(comicId, chapterId) {
            currentComic = komikData.find(k => k.id === comicId);
            currentChapter = currentComic.chapters.find(ch => ch.id === chapterId);
            currentPage = 1;

            if (currentComic && currentChapter) {
                updateReader();
                document.getElementById('readerModal').classList.add('active');
            }
        }

        // Close Reader
        function closeReader() {
            document.getElementById('readerModal').classList.remove('active');
        }

        // Update Reader
        function updateReader() {
            if (!currentComic || !currentChapter) return;
            document.getElementById('readerTitle').textContent = currentComic.title;
            document.getElementById('readerChapterInfo').textContent = `${currentChapter.name} • Halaman ${currentPage}/${currentChapter.pages}`;
            document.getElementById('readerImage').src = `https://via.placeholder.com/400x600?text=${currentChapter.name}+Page+${currentPage}`;
        }

        // Next Page
        function nextPage() {
            if (currentChapter && currentPage < currentChapter.pages) {
                currentPage++;
                updateReader();
            }
        }

        // Previous Page
        function previousPage() {
            if (currentChapter && currentPage > 1) {
                currentPage--;
                updateReader();
            }
        }

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('readerModal').classList.contains('active')) {
                if (e.key === 'ArrowRight') nextPage();
                if (e.key === 'ArrowLeft') previousPage();
                if (e.key === 'Escape') closeReader();
            }
        });
    </script>
</body>
</html>
